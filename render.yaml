services:
  - type: web
    name: smart-queue-system
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SMART_QUEUE_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
